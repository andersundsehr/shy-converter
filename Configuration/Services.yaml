services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false
  Andersundsehr\ShyConverter\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  Andersundsehr\ShyConverter\Form\Element\VisibleShyElement:
    public: true

  Andersundsehr\ShyConverter\Form\FormDataProvider\VisibleShyFormDataProvider:
    public: true

  Andersundsehr\ShyConverter\Hooks\DataHandlerHook:
    public: true
